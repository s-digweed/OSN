name: Grab OSN EPG (every 3 days)

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch:

jobs:
  grab-osn:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clone epg grabber
        run: git clone --depth 1 https://github.com/iptv-org/epg.git epg-src

      - name: Install dependencies
        run: cd epg-src && npm install

      - name: Copy Legacy config
        run: |
          mkdir -p epg-src/sites/osn_legacy
          cp osn_legacy.config.js epg-src/sites/osn_legacy/osn_legacy.config.js

      - name: Copy custom EN channels file
        run: cp osn_legacy_en.channels.xml epg-src/sites/osn_legacy/osn_legacy_en.channels.xml

      - name: Copy custom AR channels file
        run: cp osn_legacy_ar.channels.xml epg-src/sites/osn_legacy/osn_legacy_ar.channels.xml

      # ── Parse Legacy channels ─────────────────────────────
      - name: Parse OSN Legacy EN channels
        run: |
          cd epg-src
          npm run channels:parse -- --config=./sites/osn_legacy/osn_legacy.config.js \
            --output=./sites/osn_legacy/osn_legacy_parsed_en.channels.xml \
            --set=lang:en
        continue-on-error: true

      - name: Parse OSN Legacy AR channels
        run: |
          cd epg-src
          npm run channels:parse -- --config=./sites/osn_legacy/osn_legacy.config.js \
            --output=./sites/osn_legacy/osn_legacy_parsed_ar.channels.xml \
            --set=lang:ar
        continue-on-error: true

      # ── OSN Android English ───────────────────────────────
      - name: Parse OSN Android EN channels
        run: |
          cd epg-src
          npm run channels:parse -- --config=./sites/osn.com/osn.com.config.js \
            --output=./sites/osn.com/osn.com_en.channels.xml \
            --set=lang:en
        continue-on-error: true

      - name: Grab OSN Android EN guide
        run: |
          cd epg-src
          npm run grab -- --channels=./sites/osn.com/osn.com_en.channels.xml \
            --output=OSN_ANDROID_EN.xml --days=5
        continue-on-error: true

      # ── OSN Android Arabic ────────────────────────────────
      - name: Parse OSN Android AR channels
        run: |
          cd epg-src
          npm run channels:parse -- --config=./sites/osn.com/osn.com.config.js \
            --output=./sites/osn.com/osn.com_ar.channels.xml \
            --set=lang:ar
        continue-on-error: true

      - name: Grab OSN Android AR guide
        run: |
          cd epg-src
          npm run grab -- --channels=./sites/osn.com/osn.com_ar.channels.xml \
            --output=OSN_ANDROID_AR.xml --days=5
        continue-on-error: true

      # ── OSN Legacy English (all channels, then filter) ────
      - name: Clear epg cache
        run: rm -rf epg-src/.cache

      - name: Grab OSN Legacy EN guide
        run: |
          cd epg-src
          npm run grab -- --channels=./sites/osn_legacy/osn_legacy_parsed_en.channels.xml \
            --output=OSN_LEGACY_EN_FULL.xml --days=5
        continue-on-error: true

      - name: Filter Legacy EN to target channels only
        run: |
          python3 -c "
import xml.etree.ElementTree as ET
import os

target_ids = {'5674','5673','4514','4513','5675','5676','311','312','216','224','209','220','223','211','203','202','217'}

if not os.path.exists('epg-src/OSN_LEGACY_EN_FULL.xml'):
    print('No Legacy EN file to filter')
    exit()

tree = ET.parse('epg-src/OSN_LEGACY_EN_FULL.xml')
root = tree.getroot()
new_root = ET.Element('tv')

for child in root:
    if child.tag == 'channel' and child.get('id') in target_ids:
        new_root.append(child)
    elif child.tag == 'programme' and child.get('channel') in target_ids:
        new_root.append(child)

ET.ElementTree(new_root).write('epg-src/OSN_LEGACY_EN.xml', encoding='UTF-8', xml_declaration=True)
print('Filtered EN done')

for tid in target_ids:
    count = sum(1 for c in new_root if c.tag == 'programme' and c.get('channel') == tid)
    name = next((c.find('display-name').text for c in new_root if c.tag == 'channel' and c.get('id') == tid), tid)
    print(f'{name} ({tid}): {count} programmes')
"
        continue-on-error: true

      # ── OSN Legacy Arabic (all channels, then filter) ─────
      - name: Grab OSN Legacy AR guide
        run: |
          cd epg-src
          npm run grab -- --channels=./sites/osn_legacy/osn_legacy_parsed_ar.channels.xml \
            --output=OSN_LEGACY_AR_FULL.xml --days=5
        continue-on-error: true

      - name: Filter Legacy AR to target channels only
        run: |
          python3 -c "
import xml.etree.ElementTree as ET
import os

target_ids = {'5674','5673','4514','4513','5675','5676','311','312','216','224','209','220','223','211','203','202','217'}

if not os.path.exists('epg-src/OSN_LEGACY_AR_FULL.xml'):
    print('No Legacy AR file to filter')
    exit()

tree = ET.parse('epg-src/OSN_LEGACY_AR_FULL.xml')
root = tree.getroot()
new_root = ET.Element('tv')

for child in root:
    if child.tag == 'channel' and child.get('id') in target_ids:
        new_root.append(child)
    elif child.tag == 'programme' and child.get('channel') in target_ids:
        new_root.append(child)

ET.ElementTree(new_root).write('epg-src/OSN_LEGACY_AR.xml', encoding='UTF-8', xml_declaration=True)
print('Filtered AR done')

for tid in target_ids:
    count = sum(1 for c in new_root if c.tag == 'programme' and c.get('channel') == tid)
    name = next((c.find('display-name').text for c in new_root if c.tag == 'channel' and c.get('id') == tid), tid)
    print(f'{name} ({tid}): {count} programmes')
"
        continue-on-error: true

      # ── Merge Android + Legacy ────────────────────────────
      - name: Merge EN files
        run: python3 merge_epg.py EN

      - name: Merge AR files
        run: python3 merge_epg.py AR

      # ── Gzip and commit ───────────────────────────────────
      - name: Gzip EN
        run: |
          if [ -f epg-src/OSN_EN.xml ]; then
            gzip -f epg-src/OSN_EN.xml
            cp epg-src/OSN_EN.xml.gz OSN_EN.xml.gz
          fi

      - name: Gzip AR
        run: |
          if [ -f epg-src/OSN_AR.xml ]; then
            gzip -f epg-src/OSN_AR.xml
            cp epg-src/OSN_AR.xml.gz OSN_AR.xml.gz
          fi

      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add OSN_EN.xml.gz OSN_AR.xml.gz
          git commit -m "Update OSN EPG" || echo "No changes"
          git push
